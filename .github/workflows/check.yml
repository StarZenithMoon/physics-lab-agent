name: Check source and numerics

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m labcore.demo --out results/ci-demo
      - run: python -m rsi.outer_loop --plan
      - run: python -m tools.package_source --out dist/source.zip

  optional-mc:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-mc.txt
      - run: python -m pip install -r requirements-mc.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
